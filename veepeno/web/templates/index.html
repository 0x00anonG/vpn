<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeePeno VPN - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 48px 0 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
            background-color: #f8f9fa;
        }
        .sidebar-sticky {
            position: relative;
            top: 0;
            height: calc(100vh - 48px);
            padding-top: .5rem;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .main-content {
            margin-left: 240px;
            padding: 20px;
        }
        .client-card {
            transition: transform 0.2s;
        }
        .client-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">VeePeno VPN</a>
            <div class="d-flex">
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <i class="bi bi-house-door"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#newClientModal">
                                <i class="bi bi-plus-circle"></i> New Client
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">VPN Clients</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newClientModal">
                        <i class="bi bi-plus-lg"></i> New Client
                    </button>
                </div>

                <div class="row" id="clientsList">
                    <!-- Client cards will be dynamically added here -->
                </div>
            </main>
        </div>
    </div>

    <!-- New Client Modal -->
    <div class="modal fade" id="newClientModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Client</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="newClientForm">
                        <div class="mb-3">
                            <label for="clientName" class="form-label">Client Name</label>
                            <input type="text" class="form-control" id="clientName" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="createClientBtn">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display clients
        async function loadClients() {
            try {
                const response = await fetch('/api/clients');
                const clients = await response.json();
                const clientsList = document.getElementById('clientsList');
                clientsList.innerHTML = '';

                clients.forEach(client => {
                    const card = createClientCard(client);
                    clientsList.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading clients:', error);
            }
        }

        // Create client card
        function createClientCard(client) {
            const div = document.createElement('div');
            div.className = 'col-md-4 mb-4';
            div.innerHTML = `
                <div class="card client-card">
                    <div class="card-body">
                        <h5 class="card-title">${client.name}</h5>
                        <p class="card-text">
                            <small class="text-muted">Created: ${new Date(client.created_at).toLocaleDateString()}</small>
                        </p>
                        <div class="d-flex justify-content-between">
                            <a href="/api/clients/${client.name}/config" class="btn btn-primary btn-sm">
                                <i class="bi bi-download"></i> Download Config
                            </a>
                            <button class="btn btn-danger btn-sm" onclick="revokeClient('${client.name}')">
                                <i class="bi bi-trash"></i> Revoke
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        // Create new client
        document.getElementById('createClientBtn').addEventListener('click', async () => {
            const clientName = document.getElementById('clientName').value;
            if (!clientName) return;

            try {
                const response = await fetch('/api/clients', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name: clientName }),
                });

                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('newClientModal'));
                    modal.hide();
                    document.getElementById('newClientForm').reset();
                    loadClients();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to create client');
                }
            } catch (error) {
                console.error('Error creating client:', error);
                alert('Failed to create client');
            }
        });

        // Revoke client
        async function revokeClient(clientName) {
            if (!confirm(`Are you sure you want to revoke ${clientName}?`)) return;

            try {
                const response = await fetch(`/api/clients/${clientName}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    loadClients();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to revoke client');
                }
            } catch (error) {
                console.error('Error revoking client:', error);
                alert('Failed to revoke client');
            }
        }

        // Load clients on page load
        document.addEventListener('DOMContentLoaded', loadClients);
    </script>
</body>
</html>
